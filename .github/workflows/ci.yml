name: Cloud-ByteXL CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask flask-cors pytest

      - name: Check Python syntax
        run: |
          python -m py_compile backend/app.py

      - name: Run tests
        run: |
          python -m pytest backend/tests/test_app.py

      - name: Build Docker image
        run: |
          docker build -t cloud-bytexl-backend .

      - name: Run Docker container
        run: |
          docker run -d --name cloud-bytexl-container -p 5000:5000 cloud-bytexl-backend
          sleep 5

      - name: Test Docker container
        run: |
          curl --fail http://localhost:5000/

      - name: Update CI status
        if: success()
        run: |
          curl --fail -X POST https://implode-elephant-sensitive.ngrok-free.dev/api/ci/status \
            -H "Content-Type: application/json" \
            -H "ngrok-skip-browser-warning: true" \
            -d '{
              "status": "SUCCESS",
              "build": "PASSED",
              "tests": "PASSED",
              "docker": "PASSED",
              "workflow": "Cloud-ByteXL CI"
            }'

      - name: CI completed
        if: success()
        run: |
          echo "Cloud-ByteXL CI pipeline completed successfully!"
          echo "Build: PASSED"
          echo "Tests: PASSED"
          echo "Docker: PASSED"

      - name: Cleanup Docker container
        if: always()
        run: |
          docker rm -f cloud-bytexl-container || true