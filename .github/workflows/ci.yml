name: Cloud-ByteXL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cloud_bytexl_ci
          POSTGRES_PASSWORD: isolated-ci-only
          POSTGRES_DB: cloud_bytexl_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_bytexl_ci -d cloud_bytexl_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHON_DOTENV_DISABLED: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_NAME: cloud_bytexl_ci_test
      DB_USER: cloud_bytexl_ci
      DB_PASSWORD: isolated-ci-only
      AI_TEST_DATABASE: '1'
      RCA_PROVIDER: none
      OPENAI_API_KEY: ''
      GEMINI_API_KEY: ''
      GITHUB_TOKEN: ''
      AI_ADMIN_TOKEN: ''
      AI_ALLOWED_REPOSITORIES: ''
      CI_STATUS_TOKEN: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip check

      - name: Check Python syntax
        id: syntax
        run: python -m compileall -q backend/app.py backend/ci_callbacks.py backend/ai_intelligence backend/tools

      - name: Initialize isolated AI database
        run: python -m backend.ai_intelligence.cli migrate

      - name: Run complete backend tests (offline AI fixtures)
        id: tests
        run: python -m pytest backend/tests/ -v

      - name: Build Docker image
        id: docker_build
        run: docker build -t cloud-bytexl-backend .

      - name: Run Docker container
        id: docker_run
        run: |
          docker run -d --name cloud-bytexl-container \
            -p 127.0.0.1:5000:5000 \
            -e PYTHON_DOTENV_DISABLED=1 -e RCA_PROVIDER=none \
            cloud-bytexl-backend

      - name: Test Docker container
        id: docker_test
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:5000/ > /dev/null; then
              echo 'Container HTTP health check passed.'
              exit 0
            fi
            sleep 1
          done
          docker logs --tail 100 cloud-bytexl-container
          exit 1

      # External callback delivery stays disabled. The full test suite verifies
      # durable sender/Flask/PostgreSQL round trips on runner-local loopback.

      - name: Cleanup Docker container
        if: always()
        run: |
          if docker container inspect cloud-bytexl-container > /dev/null 2>&1; then
            docker rm -f cloud-bytexl-container || echo '::warning::Container cleanup failed.'
          fi
